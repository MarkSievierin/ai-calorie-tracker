# /etc/nginx/sites-available/kkal -> sites-enabled/kkal
# HTTPS lines are added by certbot (--nginx). Replace kkal.example.com with the real domain.

# Access log without the query string: the MCP connector URL carries ?key=<token>.
log_format kkal_noquery '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent $request_time "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name kkal.example.com;

    access_log /var/log/nginx/kkal.access.log kkal_noquery;
    # error level would print the full request line (with the token) on upstream errors.
    error_log /var/log/nginx/kkal.error.log crit;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
